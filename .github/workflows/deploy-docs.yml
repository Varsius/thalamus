name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'website/**'
      - 'api/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PAGES_BASE: thalamus

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      versions: ${{ steps.set-version.outputs.versions }}
      latest_release: ${{ steps.set-version.outputs.latest_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate API reference docs
        run: make docs

      - name: Set documentation version
        id: set-version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            version="main"
            chart_version="0.0.0-main"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            chart_version="${GITHUB_REF#refs/tags/}"
          else
            version=""
            chart_version=""
          fi
          # Latest released tag, or "main" when no release exists yet.
          latest_release="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          [[ -n "$latest_release" ]] || latest_release="main"
          # All release tags, newest first, comma separated (e.g. "v0.2.0,v0.1.0").
          versions="$(git tag --list 'v*' --sort=-v:refname | paste -sd, -)"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "chart_version=$chart_version" >> $GITHUB_OUTPUT
          echo "latest_release=$latest_release" >> $GITHUB_OUTPUT
          echo "versions=$versions" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build VitePress site
        working-directory: website
        run: npm run docs:build
        env:
          DOCS_VERSION: ${{ steps.set-version.outputs.version }}
          CHART_VERSION: ${{ steps.set-version.outputs.chart_version }}
          DOCS_VERSIONS: ${{ steps.set-version.outputs.versions }}
          LATEST_VERSION: ${{ steps.set-version.outputs.latest_release }}
          DOCUMENTATION_REPOSITORY_URL: https://github.com/${{ github.repository }}

      - name: Generate root redirect
        id: root-redirect
        if: ${{ steps.set-version.outputs.version != '' }}
        run: |
          target="${{ steps.set-version.outputs.latest_release }}"
          url="/${{ env.PAGES_BASE }}/${target}/"
          out="${RUNNER_TEMP}/root-redirect"
          mkdir -p "$out"
          touch "$out/.nojekyll"
          cat > "$out/index.html" <<EOF
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=${url}">
              <link rel="canonical" href="https://${{ github.repository_owner }}.github.io${url}">
              <title>Thalamus Documentation</title>
            </head>
            <body>
              <p>Redirecting to the latest documentation at <a href="${url}">${url}</a>…</p>
            </body>
          </html>
          EOF
          echo "path=$out" >> $GITHUB_OUTPUT

      - name: Deploy versioned docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/.vitepress/dist
          branch: gh-pages
          target-folder: ${{ steps.set-version.outputs.version }}
          clean-exclude: pr-preview
          force: false

      - name: Deploy root redirect
        if: ${{ steps.root-redirect.outputs.path != '' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.root-redirect.outputs.path }}
          branch: gh-pages
          target-folder: .
          clean: false
          force: false

  # On a release, previously built versions are stale snapshots: their dropdown
  # does not know about the new release and the "outdated version" banner can
  # never trigger. Rebuild all older versions with the updated version list.
  list-older-versions:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List older versions
        id: list
        run: |
          current="${GITHUB_REF#refs/tags/}"
          json=""
          count=0
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            [[ "$tag" == "$current" ]] && continue
            json+="${json:+,}\"${tag}\""
            count=$((count + 1))
          done
          echo "matrix=[${json}]" >> $GITHUB_OUTPUT
          echo "count=$count" >> $GITHUB_OUTPUT

  redeploy-older-versions:
    if: startsWith(github.ref, 'refs/tags/v') && needs.list-older-versions.outputs.count != '0'
    needs: [build, list-older-versions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-redeploy-${{ github.ref_name }}-${{ matrix.tag }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.list-older-versions.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate API reference docs
        run: make docs

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build VitePress site
        working-directory: website
        run: npm run docs:build
        env:
          DOCS_VERSION: ${{ matrix.tag }}
          CHART_VERSION: ${{ matrix.tag }}
          DOCS_VERSIONS: ${{ needs.build.outputs.versions }}
          LATEST_VERSION: ${{ needs.build.outputs.latest_release }}
          DOCUMENTATION_REPOSITORY_URL: https://github.com/${{ github.repository }}

      - name: Deploy versioned docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/.vitepress/dist
          branch: gh-pages
          target-folder: ${{ matrix.tag }}
          clean-exclude: pr-preview
          force: false
